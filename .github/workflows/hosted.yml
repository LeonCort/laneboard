name: Verify hosted app
on:
  workflow_dispatch:
    inputs:
      url:
        description: Public deployment URL
        required: true
        type: string
permissions:
  contents: read
jobs:
  browsers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit chrome msedge
      - run: npm run test:e2e
        env:
          BASE_URL: ${{ inputs.url }}
          RELEASE_BROWSERS: "1"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: hosted-browser-test-report
          path: playwright-report/
